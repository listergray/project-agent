worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Unified gateway. Public entry: http://<host>:9080/
    # Path map:
    #   /                  -> RuoYi UI :8000 (its dev proxy still forwards /api and /pa-api)
    #   /gw/ruoyi/         -> RuoYi API :8088
    #   /gw/agent/         -> Python Agent :8080
    #   /gw/nest/          -> Nest stub :48080
    #   /gw/xianyu/        -> xianyu-auto :12400
    #   /gw/douyin/        -> douyin-auto :12500
    #   /gw/myhome/        -> myhome UI :18001
    server {
        listen 9080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /gw/health {
            default_type text/plain;
            return 200 "gateway ok\n";
        }

        location /gw/ruoyi/ {
            proxy_pass http://127.0.0.1:8088/;
        }

        location /gw/agent/api/ {
            proxy_pass http://127.0.0.1:8080/api/;
        }

        location /gw/agent/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript;
            sub_filter 'href="/' 'href="/gw/agent/';
            sub_filter 'src="/' 'src="/gw/agent/';
            sub_filter 'action="/' 'action="/gw/agent/';
            sub_filter 'url("/' 'url("/gw/agent/';
            sub_filter 'url(/' 'url(/gw/agent/';
            sub_filter '"/api' '"/gw/agent/api';
            sub_filter "'/api" "'/gw/agent/api";
            sub_filter '`/api' '`/gw/agent/api';
            sub_filter '"/assets' '"/gw/agent/assets';
            sub_filter "'/assets" "'/gw/agent/assets";
            sub_filter '`/assets' '`/gw/agent/assets';
        }

        location /gw/nest/ {
            proxy_pass http://127.0.0.1:48080/;
        }

        # APIs stay untouched; HTML/JS/CSS get the /gw/<name> prefix so the
        # browser stays on this gateway instead of the app's own root paths.
        location /gw/xianyu/api/ {
            proxy_pass http://127.0.0.1:12400/api/;
        }

        location /gw/xianyu/ {
            proxy_pass http://127.0.0.1:12400/;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript;
            sub_filter 'href="/' 'href="/gw/xianyu/';
            sub_filter 'src="/' 'src="/gw/xianyu/';
            sub_filter 'action="/' 'action="/gw/xianyu/';
            sub_filter 'url("/' 'url("/gw/xianyu/';
            sub_filter 'url(/' 'url(/gw/xianyu/';
            sub_filter '"/api' '"/gw/xianyu/api';
            sub_filter "'/api" "'/gw/xianyu/api";
            sub_filter '`/api' '`/gw/xianyu/api';
            sub_filter '"/assets' '"/gw/xianyu/assets';
            sub_filter "'/assets" "'/gw/xianyu/assets";
            sub_filter '`/assets' '`/gw/xianyu/assets';
        }

        location /gw/douyin/api/ {
            proxy_pass http://127.0.0.1:12500/api/;
        }

        location /gw/douyin/ {
            proxy_pass http://127.0.0.1:12500/;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript;
            sub_filter 'href="/' 'href="/gw/douyin/';
            sub_filter 'src="/' 'src="/gw/douyin/';
            sub_filter 'action="/' 'action="/gw/douyin/';
            sub_filter 'url("/' 'url("/gw/douyin/';
            sub_filter 'url(/' 'url(/gw/douyin/';
            sub_filter '"/api' '"/gw/douyin/api';
            sub_filter "'/api" "'/gw/douyin/api";
            sub_filter '`/api' '`/gw/douyin/api';
            sub_filter '"/assets' '"/gw/douyin/assets';
            sub_filter "'/assets" "'/gw/douyin/assets";
            sub_filter '`/assets' '`/gw/douyin/assets';
        }

        location /gw/myhome/api/ {
            proxy_pass http://127.0.0.1:18001/api/;
        }

        location /gw/myhome/ {
            proxy_pass http://127.0.0.1:18001/;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript;
            sub_filter 'href="/' 'href="/gw/myhome/';
            sub_filter 'src="/' 'src="/gw/myhome/';
            sub_filter 'action="/' 'action="/gw/myhome/';
            sub_filter 'url("/' 'url("/gw/myhome/';
            sub_filter 'url(/' 'url(/gw/myhome/';
            sub_filter '"/api' '"/gw/myhome/api';
            sub_filter "'/api" "'/gw/myhome/api";
            sub_filter '`/api' '`/gw/myhome/api';
            sub_filter '"/assets' '"/gw/myhome/assets';
            sub_filter "'/assets" "'/gw/myhome/assets";
            sub_filter '`/assets' '`/gw/myhome/assets';
        }

        # RuoYi UI (umi). Upstream Host must stay local � webpack-dev-server rejects
        # unknown public Host headers. Browser URL is unchanged (window.location OK).
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host 127.0.0.1:8000;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
