# Project Agent · 中间件编排（Milvus + MinIO + MySQL + Redis）
#
# 预研项目选型（Windows 一台电脑直接跑）：
#   · Milvus standalone_embed：单容器内嵌 SQLite + LocalStorage + 内嵌 etcd/MinIO，
#     不要额外起 3 个依赖容器，资源占用比官方 compose 少 60%。
#   · MySQL 8：初始化 SQL 直接建 dim_asset / dim_employee / fct_invoice，
#     与 rag_tools.py 内存 Mock 数据一致，便于后续把工具层切真 MySQL。
#   · Redis 7-alpine：Redisson 锁 + 对话缓存。
#   · MinIO：PDF/MD/Excel 文件存储（RAG 知识库 导入时选 MinIO 模式替代本地文件）。
#
# 启动（Windows PowerShell）：
#   cd docker
#   docker compose up -d
#   docker compose ps   # 看到 4 个 healthy ≈ 30~60s
#
# 验证初始化：
#   docker exec mysql-agent mysql -uroot -proot123456 project_agent_meta -e "SELECT code,name,stock FROM dim_asset;"

services:

  # ============================================================
  # Milvus 2.4 standalone_embed（单容器 = etcd+MinIO+Milvus+SQLite 本地存储）
  # ============================================================
  milvus:
    image: milvusdb/milvus:v2.4.14
    container_name: milvus-agent
    hostname: milvus
    # Milvus 2.4.x：内嵌 etcd / LocalStorage 由下方环境变量控制，
    # standalone 子命令不接受 --embed-etcd / --local-storage 这类 CLI flag（会报 flag not defined）。
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      LOCAL_STORAGE_ENABLE: "true"
      COMMON_STORAGETYPE: "local"
      QUERY_COORD_ADDR: "localhost:19531"
    ports:
      - "19530:19530"   # gRPC（pymilvus SDK 连这个）
      - "9091:9091"     # HTTP 健康检查 / metrics
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 4g
    cpus: "2.0"
    restart: unless-stopped

  # ============================================================
  # MinIO（对象存储，放知识库源文件 + 导出的 CSV/Excel）
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: minio-agent
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API（python SDK）
      - "9001:9001"   # Web Console（浏览器 http://localhost:9001）
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped

  # ============================================================
  # MySQL 8（知识库元数据 + 演示 业务表 + 定时任务差异汇总）
  # ============================================================
  mysql:
    # 注意：本机运行实例实际为 mysql:8.4（project_agent_meta 数据卷已按 8.4 初始化）。
    # 8.4 已移除 default-authentication-plugin 这个系统变量，旧配置会导致 mysqld 启动即 abort。
    # 若坚持用 8.0，请把镜像改回 mysql:8.0 并删除 mysql_data 卷重新初始化。
    image: mysql:8.4
    container_name: mysql-agent
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: project_agent_meta
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 数据卷最初按 mysql:8.0 + mysql_native_password 初始化，root 仍是该插件。
      # 8.4 默认不加载该插件会导致 root 登录报 "Plugin 'mysql_native_password' is not loaded"，
      # 显式打开即可兼容旧数据；如需彻底迁移到 caching_sha2，登录后 ALTER USER root 即可。
      - --mysql-native-password=ON
      - --innodb-buffer-pool-size=256M
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d/:ro   # 首次启动自动执行 01_*.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    mem_limit: 1g
    cpus: "1.5"
    restart: unless-stopped

  # ============================================================
  # Redis 7-alpine（Redisson 分布式锁 + 对话缓存 + 嵌入缓存）
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis-agent
    hostname: redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "100"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    cpus: "0.5"
    restart: unless-stopped

volumes:
  milvus_data:
  minio_data:
  mysql_data:
  redis_data:
