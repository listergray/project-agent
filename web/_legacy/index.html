<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Agent</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#0f172a;
    background:
      radial-gradient(1100px 700px at 8% -10%, #dbeafe 0%, transparent 55%),
      radial-gradient(900px 600px at 100% 10%, #e0e7ff 0%, transparent 50%),
      radial-gradient(700px 500px at 50% 110%, #fce7f3 0%, transparent 55%),
      linear-gradient(180deg,#f8fbff 0%,#f1f5ff 100%);
    min-height:100vh;
    overflow-x:hidden;
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 44px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#0f172a;text-decoration:none;}
  .brand-logo{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:16px;
    box-shadow:0 6px 20px rgba(59,130,246,.35);
  }
  .hero{
    max-width:1100px;margin:0 auto;
    padding:72px 44px 30px;
  }
  .hero h2{
    font-size:14px;color:#3b82f6;font-weight:600;margin:0 0 18px;
    display:flex;align-items:center;gap:8px;
  }
  .hero h2::before{content:"";width:6px;height:6px;border-radius:50%;background:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.15);}
  .hero h1{
    font-size:54px;font-weight:700;margin:0 0 36px;letter-spacing:-1px;
    background:linear-gradient(135deg,#0f172a 30%,#3b82f6);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .card-row{display:flex;gap:18px;flex-wrap:wrap;}
  .glass{
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.9);
    border-radius:18px;padding:22px 24px;
    backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(15,23,42,.06);
    cursor:pointer;text-decoration:none;color:inherit;
    transition:transform .22s ease, box-shadow .22s ease;
    min-width:240px;flex:1 1 240px;
  }
  .glass:hover{transform:translateY(-3px);box-shadow:0 18px 50px rgba(15,23,42,.12);}
  .glass .ic{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    margin-bottom:14px;
  }
  .glass.chat .ic{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#2563eb;}
  .glass.project .ic{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#0d9488;}
  .glass.copilot .ic{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:#7c3aed;}
  .glass h3{margin:0 0 6px;font-size:16px;font-weight:600;color:#0f172a;}
  .glass p{margin:0;font-size:12.5px;color:#64748b;line-height:1.6;}
  .stats{
    max-width:1100px;margin:40px auto 60px;padding:0 44px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:18px;
  }
  @media (max-width:780px){.stats{grid-template-columns:repeat(2,1fr);}.hero h1{font-size:40px;}}
  .stat{
    background:rgba(255,255,255,.5);border:1px solid #e2e8f0;border-radius:14px;
    padding:18px 20px;backdrop-filter:blur(10px);
  }
  .stat .v{font-size:26px;font-weight:700;color:#0f172a;line-height:1.1;}
  .stat .l{font-size:12px;color:#64748b;margin-top:6px;}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="/">
    <div class="brand-logo">P</div>
    <span>Project Agent</span>
  </a>
</nav>

<section class="hero">
  <h2>AI赋能</h2>
  <h1>智化工程</h1>
  <div class="card-row">
    <a class="glass chat" href="/chat">
      <div class="ic">💬</div>
      <h3>开始对话</h3>
      <p>RAG 知识库 · 7+7 节点 · 3 个 Function Calling 工具 · Milvus 向量库 · SSE 流式</p>
    </a>
    <a class="glass project" href="/projects">
      <div class="ic">📁</div>
      <h3>项目管理</h3>
      <p>人工录入 / 文件解析 · 表单确认 · 提交审批 · 完整项目立项流程</p>
    </a>
    <a class="glass copilot" href="/pipeline">
      <div class="ic">⚡</div>
      <h3>代码助手</h3>
      <p>AI 编程提效 · 5 节点流水线 · 需求 → 代码 → 审查 → 单测 → 文档</p>
    </a>
  </div>
</section>

<section class="stats">
  <div class="stat"><div class="v" id="vChunks">—</div><div class="l">向量库 chunk 数</div></div>
  <div class="stat"><div class="v" id="vItems">—</div><div class="l">已导入知识手册</div></div>
  <div class="stat"><div class="v">7+7</div><div class="l">RAG 导入/检索节点</div></div>
  <div class="stat"><div class="v">5+1</div><div class="l">代码助手流水线节点</div></div>
</section>

<script>
fetch("/api/v1/health",{cache:"no-store"})
  .then(r=>r.json()).then(j=>{
    if(j.milvus){
      document.getElementById("vChunks").textContent = j.milvus.kb_chunks ?? "—";
      document.getElementById("vItems").textContent  = j.milvus.kb_item_names ?? "—";
    }
  }).catch(()=>{});
</script>
</body>
</html>
