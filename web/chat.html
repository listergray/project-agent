<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG 知识库 · 对话</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#0f172a;
    background:#f8fafc;
    min-height:100vh;
  }
  /* ============== 左栏 ============== */
  .sidebar{
    position:fixed;top:0;left:0;width:268px;height:100vh;
    background:#ffffff;
    border-right:1px solid #e2e8f0;
    display:flex;flex-direction:column;
    z-index:10;
  }
  .sb-head{
    padding:18px 16px 14px;
    border-bottom:1px solid #f1f5f9;
  }
  .sb-brand{display:flex;align-items:center;gap:10px;font-weight:700;color:#0f172a;font-size:15px;}
  .sb-brand .logo{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;
  }
  .new-btn{
    margin-top:12px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;background:#f1f5f9;border:1px solid #e2e8f0;
    border-radius:10px;padding:8px 12px;font-size:13px;color:#0f172a;cursor:pointer;
    transition:all .15s ease;
  }
  .new-btn:hover{background:#e2e8f0;}
  .sb-list{flex:1;overflow-y:auto;padding:12px 8px;}
  .sb-section{margin-bottom:14px;}
  .sb-section h4{
    font-size:11px;color:#94a3b8;font-weight:600;
    margin:8px 8px 6px;letter-spacing:.5px;text-transform:uppercase;
  }
  .sb-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;border-radius:8px;font-size:13px;color:#334155;
    cursor:pointer;transition:background .12s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sb-item:hover{background:#f1f5f9;}
  .sb-item .ic{font-size:12px;color:#94a3b8;}
  .sb-foot{
    padding:12px 14px;border-top:1px solid #f1f5f9;
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:#475569;
  }
  .sb-foot .av{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#fde68a,#fb923c);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;
  }
  /* ============== 主区 ============== */
  .main{
    margin-left:268px;height:100vh;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
  }
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;border-bottom:1px solid #f1f5f9;background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);
  }
  .crumb{font-size:13px;color:#64748b;}
  .crumb a{color:#3b82f6;text-decoration:none;}
  .crumb a:hover{text-decoration:underline;}
  .badge-ok{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;font-size:12px;
    background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;
  }
  .badge-bad{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;font-size:12px;
    background:#fef2f2;color:#dc2626;border:1px solid #fecaca;
  }
  .badge-dot{width:7px;height:7px;border-radius:50%;background:#10b981;}
  .badge-bad .badge-dot{background:#ef4444;}
  /* ============== 聊天区 ============== */
  .chat-wrap{flex:1;overflow-y:auto;padding:24px 28px 16px;}
  .empty-state{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#94a3b8;text-align:center;padding:30px;
  }
  .empty-state .logo-big{
    width:64px;height:64px;border-radius:18px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;
    box-shadow:0 14px 38px rgba(59,130,246,.35);
    margin-bottom:22px;
  }
  .empty-state h1{font-size:22px;color:#0f172a;margin:0 0 8px;}
  .empty-state p{margin:0 0 22px;font-size:13.5px;}
  .mode-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .mode{
    display:inline-flex;align-items:center;gap:5px;
    padding:8px 14px;border-radius:999px;background:#eff6ff;border:1px solid #bfdbfe;
    color:#1d4ed8;font-size:13px;font-weight:500;cursor:pointer;
  }
  .mode:hover{background:#dbeafe;}
  .mode.on{background:#3b82f6;color:#fff;border-color:#3b82f6;}
  .msg{display:flex;gap:10px;margin:18px 0;}
  .msg.user{flex-direction:row-reverse;}
  .msg .av{
    flex-shrink:0;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;
  }
  .msg.bot .av{background:linear-gradient(135deg,#3b82f6,#2563eb);}
  .msg.user .av{background:linear-gradient(135deg,#94a3b8,#64748b);}
  .msg .bubble{
    max-width:760px;
    background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;
    padding:14px 16px;font-size:14px;line-height:1.65;color:#0f172a;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .msg.user .bubble{
    background:#eff6ff;border-color:#bfdbfe;
  }
  .intent-chip{
    display:inline-block;padding:3px 10px;border-radius:999px;
    font-size:11.5px;font-weight:600;color:#475569;background:#f1f5f9;
    margin-bottom:10px;
  }
  .intent-chip.code{background:#ecfdf5;color:#059669;}
  .section{margin-top:12px;}
  .section .lbl{font-size:11.5px;color:#64748b;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .toolcard{
    background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;
    padding:9px 12px;margin-bottom:6px;
  }
  .toolcard .name{font-size:12px;color:#3b82f6;font-weight:600;font-family:ui-monospace,SFM-Regular-Regular,Menlo,monospace;}
  .toolcard pre{
    margin:6px 0 0;font-size:12px;color:#475569;line-height:1.5;
    white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,monospace;
  }
  .src{
    display:inline-block;background:#f1f5f9;border:1px solid #e2e8f0;
    color:#475569;padding:4px 9px;border-radius:7px;font-size:11.5px;
    margin:3px 4px 0 0;
  }
  .meta{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:#94a3b8;}
  .typing{color:#94a3b8;font-style:italic;}
  /* ============== 输入区 ============== */
  .input-area{
    padding:16px 28px 24px;
    background:linear-gradient(180deg,rgba(248,250,252,0) 0%,#f8fafc 60%);
  }
  .input-box{
    background:#ffffff;border:1px solid #e2e8f0;border-radius:18px;
    padding:14px 16px 12px;
    box-shadow:0 8px 24px rgba(15,23,42,.05);
  }
  .input-box textarea{
    width:100%;border:0;outline:0;resize:none;
    font:inherit;font-size:14.5px;color:#0f172a;background:transparent;
    min-height:24px;max-height:180px;line-height:1.55;
  }
  .input-tools{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:10px;
  }
  .tools-l{display:flex;gap:6px;}
  .chip-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 12px;border-radius:999px;
    background:#f1f5f9;border:1px solid #e2e8f0;
    color:#475569;font-size:12.5px;cursor:pointer;
  }
  .chip-btn:hover{background:#e2e8f0;}
  .send-btn{
    width:34px;height:34px;border-radius:50%;
    background:#3b82f6;color:#fff;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    box-shadow:0 6px 14px rgba(59,130,246,.35);
    transition:transform .12s ease;
  }
  .send-btn:hover{transform:scale(1.06);}
  .send-btn:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed;}
  .err{color:#dc2626;font-size:12.5px;margin-top:8px;padding-left:4px;}
  .presets{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  }
  .preset{
    background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;
    padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;
  }
  .preset:hover{background:#e2e8f0;color:#0f172a;}
  .preset .tag{color:#3b82f6;font-weight:600;margin-right:4px;}
  /* 小屏 */
  @media (max-width:780px){
    .sidebar{position:relative;width:100%;height:auto;}
    .main{margin-left:0;height:auto;}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-brand">
      <div class="logo">P</div>
      <span>Project Agent</span>
    </div>
    <button class="new-btn" onclick="newChat()">
      <span>＋</span> 开始新对话
    </button>
  </div>

  <div class="sb-list">
    <div class="sb-section">
      <h4>今天</h4>
      <div class="sb-item" onclick="quickAsk('FS-2024-0876 现在有多少库存？单价和总价是多少？')">
        <span class="ic">💬</span><span>FS-2024-0876 库存</span>
      </div>
      <div class="sb-item" onclick="quickAsk('固定资产入库的完整流程是什么？')">
        <span class="ic">💬</span><span>固定资产入库流程</span>
      </div>
      <div class="sb-item" onclick="quickAsk('帮我查一下员工陈昊的工号、部门和岗位，存货/库存相关的同义词有哪些？')">
        <span class="ic">💬</span><span>陈昊工号与同义词</span>
      </div>
    </div>

    <div class="sb-section">
      <h4>7 天内</h4>
      <div class="sb-item" onclick="quickAsk('给我导出一份公司所有工作站、笔记本、服务器的库存清单到表格。')">
        <span class="ic">💬</span><span>导出全部工作站库存</span>
      </div>
      <div class="sb-item" onclick="quickAsk('FIN-INV-2024-001 是什么单据？金额多少？')">
        <span class="ic">💬</span><span>FIN-INV-2024-001 单据</span>
      </div>
    </div>

    <div class="sb-section">
      <h4>30 天内</h4>
      <div class="sb-item" onclick="quickAsk('同义词词典加载机制是怎样的？')">
        <span class="ic">💬</span><span>同义词热加载</span>
      </div>
      <div class="sb-item" onclick="quickAsk('资产盘点模块如何处理并发导入？')">
        <span class="ic">💬</span><span>并发导入锁机制</span>
      </div>
    </div>
  </div>

  <div class="sb-foot">
    <div class="av">U</div>
    <span>本地用户</span>
  </div>
</aside>

<main class="main">
  <div class="top-bar">
    <div class="crumb">
      <a href="/">导航</a> / <strong style="color:#0f172a">RAG 知识库 · 对话</strong>
    </div>
    <div id="health"><span class="badge-ok"><span class="badge-dot"></span>检查中…</span></div>
  </div>

  <div class="chat-wrap" id="messages">
    <div class="empty-state" id="empty">
      <div class="logo-big">💬</div>
      <h1>随时开始吧</h1>
      <p>RAG 知识库 · 7 节点导入 + 7 节点检索 · 3 个 Function Calling 工具 · Milvus 向量库 · 306 chunks 就绪</p>
      <div class="mode-row">
        <span class="mode on">📌 快捷模式</span>
        <span class="mode">🔬 专家模式</span>
        <span class="mode">🖼️ 识图模式</span>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="presets" id="presets"></div>
    <div class="input-box">
      <textarea id="q" placeholder="给 RAG 知识库 发送消息…" rows="1"></textarea>
      <div class="input-tools">
        <div class="tools-l">
          <button class="chip-btn" type="button">🧠 深度思考</button>
          <button class="chip-btn" type="button">🔍 智能搜索</button>
          <button class="chip-btn" type="button">📎 附件</button>
        </div>
        <button class="send-btn" id="send" title="发送">↑</button>
      </div>
    </div>
    <div class="err" id="err"></div>
  </div>
</main>

<script>
const API = "http://127.0.0.1:8080";
const box = document.getElementById("messages");
const q = document.getElementById("q");
const sendBtn = document.getElementById("send");
const err = document.getElementById("err");

function newChat(){ box.querySelectorAll(".msg").forEach(m=>m.remove()); document.getElementById("empty")&& (document.getElementById("empty").style.display=""); q.value=""; err.textContent=""; q.focus(); }

async function checkHealth(){
  const el=document.getElementById("health");
  try{
    const r=await fetch(API+"/api/v1/health",{cache:"no-store"});
    const j=await r.json();
    const m=j.milvus||{};
    const v=(m.kb_chunks!=null&&m.kb_item_names!=null) ? `Milvus 已连接 · ${m.kb_item_names} 手册 / ${m.kb_chunks} chunks` : "Milvus 未就绪";
    el.innerHTML = `<span class="badge-ok"><span class="badge-dot"></span>${v}</span>`;
  }catch(e){
    el.innerHTML = `<span class="badge-bad"><span class="badge-dot"></span>服务未连接</span>`;
  }
}
checkHealth(); setInterval(checkHealth,8000);

fetch(API+"/api/v1/rag/presets").then(r=>r.json()).then(list=>{
  if(Array.isArray(list)&&list.length){
    document.getElementById("presets").innerHTML = list.map(p=>
      `<button class="preset" data-q="${p.query.replace(/"/g,'&quot;')}"><span class="tag">${p.tag.split("（")[0]}</span>${p.query}</button>`).join("");
    document.querySelectorAll(".preset").forEach(c=>c.onclick=()=>send(c.dataset.q));
  }
}).catch(()=>{});

function addUser(text){
  const e=document.getElementById("empty"); if(e) e.remove();
  const d=document.createElement("div"); d.className="msg user";
  d.innerHTML=`<div class="av">你</div><div class="bubble">${text.replace(/</g,"&lt;")}</div>`;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function toolCallsHTML(tcs){
  if(!tcs||!tcs.length) return `<div class="section"><div class="lbl">工具调用</div><div style="color:#94a3b8;font-size:12.5px;">本次未触发 Function Calling（fallback 模板）</div></div>`;
  return `<div class="section"><div class="lbl">工具调用 · ${tcs.length}</div>`+
    tcs.map(t=>`<div class="toolcard"><span class="name">ƒ ${t.name||t.tool||""}</span>
      <pre>${JSON.stringify(t.arguments||t.args||t,null,2)}</pre></div>`).join("")+`</div>`;
}
function sourcesHTML(srcs){
  if(!srcs||!srcs.length) return "";
  return `<div class="section"><div class="lbl">溯源 · ${srcs.length}</div>`+
    srcs.slice(0,4).map(s=>`<span class="src">${String(s).replace(/</g,"&lt;").slice(0,80)}</span>`).join("")+
    (srcs.length>4?`<span class="src">… 还有 ${srcs.length-4} 条</span>`:"")+`</div>`;
}
function addBot(res){
  const d=document.createElement("div"); d.className="msg bot";
  const intent=res.intent||"MIXED";
  const isCode=/CODE|RESOURCE|TOOL/i.test(intent);
  d.innerHTML=`<div class="av">R</div><div class="bubble">
    <span class="intent-chip ${isCode?'code':''}">意图 · ${intent}</span>
    ${toolCallsHTML(res.tool_calls)}
    ${sourcesHTML(res.sources)}
    <div style="margin-top:10px;white-space:pre-wrap;">${String(res.answer||"").replace(/</g,"&lt;")}</div>
    <div class="meta"><span>⏱ ${res.elapsed_ms||"?"} ms</span><span>🆔 ${String(res.session_id||"").slice(0,8)||"—"}</span></div>
  </div>`;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}

async function send(text){
  text=(text||q.value||"").trim(); if(!text) return;
  err.textContent=""; q.value=""; sendBtn.disabled=true;
  autoResize(); addUser(text);
  const typing=document.createElement("div"); typing.className="msg bot";
  typing.innerHTML=`<div class="av">R</div><div class="bubble typing">思考中…</div>`;
  box.appendChild(typing); box.scrollTop=box.scrollHeight;
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),90000);
  try{
    const r=await fetch(API+"/api/v1/rag/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:text}),signal:ctrl.signal});
    clearTimeout(timer); box.removeChild(typing);
    if(!r.ok){ const e=await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail&&e.detail.errors?JSON.stringify(e.detail.errors):(e.detail||r.statusText)); }
    addBot(await r.json());
  }catch(e){ clearTimeout(timer); box.removeChild(typing);
    err.textContent = (e.name==="AbortError") ? "请求超时（后端处理超过 90s，请稍后重试）" : "请求失败："+e.message; }
  finally{ sendBtn.disabled=false; q.focus(); }
}

function quickAsk(q){ send(q); }

sendBtn.onclick=()=>send();
q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }});
function autoResize(){ q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,180)+"px"; }
q.addEventListener("input",autoResize);
q.focus();
</script>
</body>
</html>
