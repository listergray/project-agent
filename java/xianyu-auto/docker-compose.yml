# 闲鱼自动发货系统 - Docker Compose 部署
# 使用方法：
#   1. 复制 .env.example 为 .env 并填写配置
#   2. 执行 docker compose up -d --build
#   3. 浏览器访问 http://<server-ip>:12400，admin/admin123 登录

services:
  xianyu-auto:
    build:
      context: .
      dockerfile: Dockerfile
    image: xianyu-auto:latest
    container_name: xianyu-auto
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-12400}:12400"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SQLITE_PATH=/app/data/xianyu.db
      - LOG_PATH=/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:12400/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
