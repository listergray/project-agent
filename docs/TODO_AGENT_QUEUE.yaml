 - id: todo-20261111-3c4ef
   title: 帮我找一个盈利方向，我要怎么做，充分分析可行性
   kind: docs
   status: done
   priority: 5
   payload: {
     }
   notes: ''
   result: |
     只推序造「企业展示型官网」：卖给能出文案和图片的小企业或工作室。交付 1 个中文单页（最多 5 个模块）、双端适配、1 个联系入口、源码和一次部署。价格带用草案 1500–3000 元/单，用户确认一个整数后再标价。199/599 月费不对外。5 元视频客单极低，成片是漏斗不是利润中心。
     可行性：官网与六图在本地；价未确认、获客稿未发、软件开发类目未核、无已确认客户。闲鱼 2026-10-19 读回 5 元视频在售（商品 1091134951396，自动发货关），记录无订单字段。90 天有条件拿到这一方向的第一单，前提是两周内确认价格并授权发出 1 条可咨询信息。本轮未打开订单页，不新写成交笔数。
     步骤：1) 确认价格，写明不含后台、表单、支付、小程序，开发费验收后付，云资源客户自付。2) 闲鱼能上网站开发就用现有六图上架 1 条，自动发货关；不能上就用同一套六图发 1 条小红书，读回标题和价格。3) 咨询只记渠道、用途、预算、下一步；30 天没有就记「无咨询」。4) 有可做的单再交付 1 个单页，开发费与云资源分开记。
     不做：不建私活门户、不加模块、不并仓；不扩 5 元视频、不自动发货、不新发另外 3 个草稿；不用技术栈成片冲本轮收入；未授权不代登录、不代发布。本轮不派工。
     证据：docs/VIDEO_SALES_OFFER.md；outputs/video_sales_20261018/闲鱼上架记录.json；E:/ai-pro/sihuo/marketing/launch/；D:/qclaw/animation-pro/TOPIC_PRIORITY.md；前序 todo-20261109-6ba91。未验证：今日是否仍在售、成交笔数、软件类目、账面收入。
